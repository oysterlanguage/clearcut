# config.yaml
general:
  debug: false
  input_folder:
    - /path/to/audio/folder
  output_path: data/segments # path to save the output segments
  train_path: data/train # path to save the train file in "segments | transcript" format
  log_level: DEBUG
  device: auto   # can be 'cuda', 'cpu', or 'auto' to detect GPU
  sample_rate: 24000 # sample rate of the output segments

whisperx_asr:
    model: "large-v3"
    language: "en"
    compute_type: "float16"
    suppress_numerals: True
    threads: 1
    asr_options:

separate_fast:
    enabled: False
    model_path: models/UVR-MDX-NET-Inst_HQ_3.onnx
    denoise: True
    margin: 44100
    chunks: 15
    n_fft: 6144
    dim_t: 8
    dim_f: 3072

normalize_byo_transcript:
    enabled: True # create a .fixed.txt version of your transcript with digits converted to ground truth text representations and common prefixs replaced
    aggressive_segment: False # instead of splitting on just ". ", "! ", "? ", also split on " - ", ": ", ", " forcing incomplete sentences

combine_segments:
    enabled: True # do we want to create more data by combining permutations of adjacent segments (to help the model learn pauses and sentence transitions)
    max_len: 30.0  # when combining adjacent segments only combine them if the add up to less than this number of seconds
    max_segments: 1 # as long as we are under the max_len join up to this number of segments
    db_std_dev_limit: 2 # This parameter defines the maximum allowable standard deviation of decibel (dB) levels at a potential cut point when compared to the rest of the cuts. If the standard deviation of the dB levels at the selected timestamp exceeds this limit, the cut will be skipped to avoid clipping during a region of high variability in audio intensity. This helps ensure cleaner segmentation by avoiding cuts in areas with significant noise, abrupt changes, or inconsistencies.

respiro:
    model_path: models/respiro-en.pt
    threshold: 0.064
    min_length: 10

find_threshold_crossing:
    threshold: -60 # dB to use for threshold crossing this determines the start and end of a segment

segment_with_threshold:
    padding: .15 # padding to add to the start and end of a segment in seconds
    symmetrical: False # if false we dynamically pad the end and use the padding value for the start

create_textgrid:
    enabled: True  # create a textgrid file for each audio file to show how we performed segmentation